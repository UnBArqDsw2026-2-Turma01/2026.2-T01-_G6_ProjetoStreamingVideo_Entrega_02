<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de diagrama</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; background: #f8fafc; }
    body { display: flex; flex-direction: column; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 7px 12px;
      border-bottom: 1px solid #cbd5e1;
      background: #fff;
    }
    button {
      min-width: 40px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      color: #0f172a;
      background: #f8fafc;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #e2e8f0; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 1px; }
    #zoomValue { min-width: 58px; text-align: center; color: #334155; font-size: 14px; }
    #viewport {
      flex: 1;
      overflow: auto;
      padding: 16px;
      cursor: grab;
      user-select: none;
    }
    #viewport.dragging { cursor: grabbing; }
    #canvas { margin: 0 auto; }
    #diagram { display: block; width: 100%; height: 100%; pointer-events: none; }
    #error { display: none; padding: 24px; color: #991b1b; text-align: center; }
  </style>
</head>
<body>
  <div class="toolbar" aria-label="Controles de zoom">
    <button id="zoomOut" type="button" title="Diminuir zoom" aria-label="Diminuir zoom">−</button>
    <span id="zoomValue" aria-live="polite">100%</span>
    <button id="zoomIn" type="button" title="Aumentar zoom" aria-label="Aumentar zoom">+</button>
    <button id="fit" type="button" title="Ajustar à largura">Ajustar</button>
    <button id="reset" type="button" title="Restaurar tamanho original">100%</button>
  </div>
  <div id="viewport">
    <div id="canvas"><img id="diagram" alt="Diagrama UML com zoom"></div>
    <div id="error">Não foi possível carregar o diagrama.</div>
  </div>
  <script>
    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('canvas');
    const diagram = document.getElementById('diagram');
    const zoomValue = document.getElementById('zoomValue');
    const source = new URLSearchParams(location.search).get('src');
    let naturalWidth = 0;
    let naturalHeight = 0;
    let scale = 1;

    function render() {
      canvas.style.width = `${Math.max(1, naturalWidth * scale)}px`;
      canvas.style.height = `${Math.max(1, naturalHeight * scale)}px`;
      zoomValue.textContent = `${Math.round(scale * 100)}%`;
    }

    function setZoom(nextScale) {
      const centerX = viewport.scrollLeft + viewport.clientWidth / 2;
      const centerY = viewport.scrollTop + viewport.clientHeight / 2;
      const ratio = Math.min(5, Math.max(0.1, nextScale)) / scale;
      scale = Math.min(5, Math.max(0.1, nextScale));
      render();
      viewport.scrollLeft = centerX * ratio - viewport.clientWidth / 2;
      viewport.scrollTop = centerY * ratio - viewport.clientHeight / 2;
    }

    function fitWidth() {
      setZoom(Math.min(1, Math.max(0.1, (viewport.clientWidth - 32) / naturalWidth)));
      viewport.scrollLeft = 0;
      viewport.scrollTop = 0;
    }

    const resolvedSource = source ? new URL(source, location.href) : null;
    if (!resolvedSource || resolvedSource.origin !== location.origin || !resolvedSource.pathname.toLowerCase().endsWith('.svg')) {
      document.getElementById('error').style.display = 'block';
    } else {
      diagram.addEventListener('load', () => {
        naturalWidth = diagram.naturalWidth || 1200;
        naturalHeight = diagram.naturalHeight || 800;
        fitWidth();
      });
      diagram.addEventListener('error', () => {
        canvas.style.display = 'none';
        document.getElementById('error').style.display = 'block';
      });
      diagram.src = resolvedSource.href;
    }

    document.getElementById('zoomIn').addEventListener('click', () => setZoom(scale * 1.25));
    document.getElementById('zoomOut').addEventListener('click', () => setZoom(scale / 1.25));
    document.getElementById('fit').addEventListener('click', fitWidth);
    document.getElementById('reset').addEventListener('click', () => setZoom(1));
    viewport.addEventListener('wheel', event => {
      if (!event.ctrlKey) return;
      event.preventDefault();
      setZoom(scale * (event.deltaY < 0 ? 1.1 : 0.9));
    }, { passive: false });

    let drag = null;
    viewport.addEventListener('pointerdown', event => {
      drag = { x: event.clientX, y: event.clientY, left: viewport.scrollLeft, top: viewport.scrollTop };
      viewport.classList.add('dragging');
      viewport.setPointerCapture(event.pointerId);
    });
    viewport.addEventListener('pointermove', event => {
      if (!drag) return;
      viewport.scrollLeft = drag.left - (event.clientX - drag.x);
      viewport.scrollTop = drag.top - (event.clientY - drag.y);
    });
    viewport.addEventListener('pointerup', () => { drag = null; viewport.classList.remove('dragging'); });
    viewport.addEventListener('pointercancel', () => { drag = null; viewport.classList.remove('dragging'); });
  </script>
</body>
</html>
